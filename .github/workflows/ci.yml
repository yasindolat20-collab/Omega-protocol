name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run core tests
        run: pytest tests/test_core.py -v

      - name: Verify imports
        run: |
          python - <<'PY'
          import agent, batch, compare, environment, leader, logger, main, memory, network, plot, shared_memory
          print('imports_ok')
          PY
